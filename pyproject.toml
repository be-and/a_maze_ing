[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "Maze generator for Codam."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

authors = [
    { name = "Beatriz Andrade" },
    { name = "Nafisa Khatoon" }
]

[tool.setuptools]
packages = ["mazegen"]